name: Daily QA job search

on:
  schedule:
    # GitHub sometimes delays or skips jobs set on the hour, so use odd minutes,
    # with a backup run that does nothing if the morning run already happened.
    # GitHub often starts scheduled runs hours late, so try several times each
    # morning. The first one that starts does the search; the rest skip.
    - cron: "17 1 * * *"   # 06:47 IST
    - cron: "47 2 * * *"   # 08:17 IST
    - cron: "47 3 * * *"   # 09:17 IST
    - cron: "47 4 * * *"   # 10:17 IST
    - cron: "47 6 * * *"   # 12:17 IST
    - cron: "47 9 * * *"   # 15:17 IST
  workflow_dispatch: {}    # adds a "Run workflow" button for manual runs
  push:                    # re-run automatically when the script or settings change
    branches: [main]
    paths: ["job_hunter.py", "config.yaml", "requirements.txt", ".github/workflows/daily.yml"]

permissions:
  contents: write          # lets the run save data/ (seen jobs + CSVs) back to the repo
  issues: write            # lets the run post each day's jobs as an issue (GitHub notifies you)

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip the backup run if today's run already happened
        id: guard
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event_name }}" != "push" ] && [ "$(cat data/last_run.txt 2>/dev/null)" = "$today" ]; then
            echo "Already ran today ($today); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Find new matching jobs
        if: steps.guard.outputs.skip != 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python job_hunter.py

      - name: Post today's jobs as a GitHub issue
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat data/new_count.txt 2>/dev/null || echo 0)" != "0" ]; then
            gh issue create \
              --title "$(head -1 data/latest.md | sed 's/^# //')" \
              --body-file data/latest.md \
              --assignee "${{ github.repository_owner }}"
          fi

      - name: Save results to the repo
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Job matches $(date -u +%F)"
          git push
